# Alternative to Fly.io: Render Blueprint (no GitHub Actions needed).
# In Render: New → Blueprint → connect this repo. Render auto-deploys on push.
# Set TURSO_DATABASE_URL, TURSO_AUTH_TOKEN and API_KEY in the Render dashboard.
services:
  - type: web
    name: access-desk-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: node index.js
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://arunselvan2506.github.io
