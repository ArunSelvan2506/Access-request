# Fly.io config for the Access Service Desk API.
# Create the app once with:  cd server && flyctl launch --no-deploy
# (change the app name below to whatever Fly assigns / you choose).
# Set secrets so data persists across deploys (the container disk is ephemeral):
#   flyctl secrets set TURSO_DATABASE_URL=... TURSO_AUTH_TOKEN=... API_KEY=... CORS_ORIGIN=https://arunselvan2506.github.io
app = "access-desk-api"
primary_region = "lhr"

[build]

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
