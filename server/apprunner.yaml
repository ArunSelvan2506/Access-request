# AWS App Runner config for the Access Service Desk API.
# App Runner builds from the Dockerfile in this directory and runs the container.
# Set env vars / secrets in the App Runner service (console or IaC), NOT here:
#   - ANTHROPIC_API_KEY  -> from AWS Secrets Manager / SSM (never plaintext)
#   - CORS_ORIGIN=https://arunselvan2506.github.io
#   - DDB_TABLE (optional; defaults to access_desk_tickets)
# The service's instance IAM role needs DynamoDB access to that table
# (and CreateTable/DescribeTable if you let the app auto-create it).
version: 1.0
runtime: docker
build:
  commands:
    build: []
run:
  command: node index.js
  network:
    port: 8787
