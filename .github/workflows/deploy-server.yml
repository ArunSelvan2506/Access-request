name: Deploy API server (Fly.io)

# Deploys the SQLite API in server/ to Fly.io. Manual by default; also runs when
# server/ changes land on main. Requires a FLY_API_TOKEN repo secret
# (create with: flyctl tokens create deploy) and a Fly app (flyctl launch).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
